name: Build KB Editor APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch Xiph RNNoise C Sources (48kHz Neural Denoiser)
        run: |
          mkdir -p app/src/main/cpp/rnnoise
          git clone --depth 1 https://github.com/xiph/rnnoise.git /tmp/rnnoise_src
          cp -r /tmp/rnnoise_src/src/*.c app/src/main/cpp/rnnoise/ || true
          cp -r /tmp/rnnoise_src/src/*.h app/src/main/cpp/rnnoise/ || true
          cp -r /tmp/rnnoise_src/include/*.h app/src/main/cpp/rnnoise/ || true
          rm -rf app/src/main/cpp/rnnoise/x86 app/src/main/cpp/rnnoise/arm

      - name: Run Engine Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KBEditor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
